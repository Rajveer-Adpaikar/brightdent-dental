    <script>
      // Pages RESTORE SPA fallback: public/404.html stored the originally
      // requested path — put it back so the router renders the right page
      // (or the React 404 page) for deep links and hard refreshes.
      (function () {
        var r = sessionStorage.getItem('redirect');
        if (r) {
          sessionStorage.removeItem('redirect');
          if (r !== location.pathname) history.replaceState(null, '', r);
